name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable package
        shell: pwsh
        run: .\tools\package-rockwall.ps1

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\Rockwall-win-x64\* -DestinationPath .\dist\Rockwall-win-x64.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME .\dist\Rockwall-win-x64.zip --generate-notes