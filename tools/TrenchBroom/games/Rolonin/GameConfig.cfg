{
    "version": 9,
    "name": "Rolonin",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" },
        { "format": "Standard" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "Textures",
        "format": { "extensions": [ ".png", ".jpg", ".jpeg", ".tga" ], "format": "image" },
        "excludes": [ "base" ]
    },
    "entities": {
        "definitions": [ "Rolonin.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "FuncTrigger*",
                "material": "tools/tool_trigger"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "tools/tool_clip"
            },
            {
                "name": "NoDraw",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "tools/tool_nodraw"
            },
            {
                "name": "LightNodeVolume",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "tools/tool_lightnodevolume"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    },
    "softMapBounds": "-32768 -32768 -32768 32768 32768 32768",
    "compilationTools": [
        { "name": "Mapcompiler", "description": "Path to Mapcompiler.exe (compiles .map into .cmap/.clm for the engine)" }
    ]
}
